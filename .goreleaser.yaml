version: 2

project_name: marvin

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: marvin
    main: ./cmd/marvin
    binary: marvin
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  # this is internal, plus it should probably be a command on marvin instead of a separate cli tool.
  # Lets comment it out for now
  #- id: provider-schema
  #  main: ./cmd/provider-schema
  #  binary: provider-schema
  #  env:
  #    - CGO_ENABLED=0
  #  goos:
  #    - linux
  #    - darwin
  #  goarch:
  #    - amd64
  #    - arm64
  #  ldflags:
  #    - -s -w
  #    - -X main.version={{.Version}}
  #    - -X main.commit={{.Commit}}
  #    - -X main.date={{.Date}}

archives:
  - id: marvin
    builds: [marvin]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - src: LICENSE*
        dst: .
      - src: README*
        dst: .

  - id: provider-schema
    builds: [provider-schema]
    formats: [tar.gz]
    name_template: >-
      provider-schema_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - src: LICENSE*
        dst: .
      - src: README*
        dst: .

